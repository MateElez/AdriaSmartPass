<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(520 260) rotate(20) scale(620 440)">
      <stop stop-color="#94a3b8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" rx="56" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="56" fill="url(#glow)"/>

  <!-- abstract system diagram -->
  <g opacity="0.85" stroke="#0f172a" stroke-width="10" stroke-linecap="round">
    <path d="M320 280h360"/>
    <path d="M920 260h360"/>
    <path d="M500 420h700"/>
    <path d="M420 600h520"/>
  </g>

  <g fill="#0f172a" opacity="0.75">
    <rect x="260" y="220" width="170" height="120" rx="28"/>
    <rect x="700" y="230" width="170" height="120" rx="28"/>
    <rect x="1140" y="210" width="210" height="140" rx="32"/>
    <rect x="380" y="520" width="260" height="160" rx="40"/>
    <rect x="740" y="500" width="520" height="200" rx="44"/>
  </g>

  <!-- small lens marks -->
  <g fill="#e2e8f0" opacity="0.85">
    <circle cx="345" cy="280" r="14"/>
    <circle cx="785" cy="290" r="14"/>
    <circle cx="1215" cy="284" r="16"/>
  </g>
</svg>
